<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Автобусы МПЗ</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css?v=202611081910">
</head>
<body>
<div id="app">
  <!-- вкладка «Карта» -->
  <section class="view" id="mapView">
    <div id="map" aria-label="Карта"></div>
    <div class="topbar">
      <button class="whenchip" id="whenChip" type="button" data-act="open-when"></button>
      <button class="whenchip" id="schedBtn" type="button" data-act="tab" data-v="sched"></button>
    </div>
    <div class="sheet" id="sheet" data-state="half">
      <div class="drag" id="drag">
        <button type="button" class="grab" data-act="grab" aria-expanded="false" aria-label="Развернуть или свернуть панель"><i></i></button>
      </div>
      <div class="rbar" id="destSeg" role="group" aria-label="Маршрут"></div>
      <div class="head" id="sheetHead"></div>
      <div class="body" id="sheetBody"></div>
      <div class="foot" id="sheetFoot"></div>
    </div>
    <div class="fabs" id="fabs"></div>
    <div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
  </section>

  <!-- вкладка «Расписание» -->
  <section class="view" id="schedView" hidden>
    <div class="sched-in">
      <div class="sh" id="schedHead"></div>
      <div id="schedList"></div>
    </div>
  </section>

</div>
<div class="cover" id="cover" hidden>
  <div class="cover-in">
    <span class="cover-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
    <b>Определяем, где вы</b>
    <span>Подтвердите доступ к местоположению в окне телефона</span>
    <button class="btn sec" type="button" data-act="cover-skip">Продолжить без геолокации</button>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js?v=202611081910"></script>
<script src="data.js?v=202611081910"></script>
<script src="app.js?v=202611081910"></script>
</body>
</html>
