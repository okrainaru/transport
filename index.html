<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Автобусы МПЗ</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- вкладка «Карта» -->
  <section class="view" id="mapView">
    <div id="map" aria-label="Карта"></div>
    <div class="topbar">
      <div class="seg" id="destSeg" role="group" aria-label="Куда едем"></div>
      <button class="whenchip" id="whenChip" type="button" data-act="open-when"></button>
    </div>
    <div class="sheet" id="sheet" data-state="half">
      <div class="drag" id="drag">
        <div class="grab" data-act="grab"><i></i></div>
        <div class="head" id="sheetHead"></div>
      </div>
      <div class="body" id="sheetBody"></div>
      <div class="foot" id="sheetFoot"></div>
    </div>
    <div class="fabs" id="fabs"></div>
    <div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
  </section>

  <!-- вкладка «Расписание» -->
  <section class="view" id="schedView" hidden>
    <div class="sched-in">
      <div class="sh" id="schedHead"></div>
      <div id="schedList"></div>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button type="button" role="tab" data-act="tab" data-v="map" aria-selected="true" id="tabMap"></button>
    <button type="button" role="tab" data-act="tab" data-v="sched" aria-selected="false" id="tabSched"></button>
  </nav>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
